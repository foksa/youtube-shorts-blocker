<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Shorts Blocker</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <h1>Shorts Blocker</h1>
  <label class="setting" for="redirect-shorts">
    <span>Redirect Shorts links</span>
    <input id="redirect-shorts" type="checkbox" role="switch" aria-describedby="description" disabled>
  </label>
  <p id="description">Send Shorts links to YouTube home or the parent channel. Turn off to open shared Shorts links.</p>
  <p class="note">Shorts stay hidden in feeds and search.</p>
  <p id="status" role="status" aria-live="polite">Loading…</p>
</body>
</html>
